name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d aws-deploy-nginx-docker ]; then
              git clone https://github.com/MBatuhanAltun/aws-deploy-nginx-docker.git
            fi
            cd aws-deploy-nginx-docker
            git pull
            docker-compose up --build -d
